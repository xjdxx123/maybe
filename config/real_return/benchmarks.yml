# Annual benchmark levels. Only ratios between years are used (growth = level[t1]/level[t0]).
# Convention: each level is anchored to ~Jan 1 of its labeled year. Series sourced at
# year-end (gold, CSI 300) are shifted +1 year so a "Dec YYYY" close anchors "Jan YYYY+1".
# `metadata` is reserved and never read as a benchmark key. `real_estate` is region-keyed.
metadata:
  source: >
    S&P 500: multpl.com year-anchored index levels.
    CSI 300: Wikipedia annual year-end closes (shifted +1y to Jan-1 convention; series begins 2005).
    Gold: LBMA USD/oz year-end via datahub/gold-prices (shifted +1y).
    deposit: cumulative growth index built from the World Bank China DEPOSIT interest rate (FR.INR.DPST), 2000-2024. REAL fetched data.
    govbond: cumulative growth index built from the World Bank China LENDING interest rate (FR.INR.LEND), 2000-2024, used as a fixed-income/credit proxy (no free bot-accessible 10y gov-bond series). REAL fetched data.
    real_estate: REAL fetched. CN = BIS nominal RPPI Q.CN.N.628 (via DBnomics), 2006-2025. US = multpl.com Case-Shiller nominal, 2000-2017 (recent years pending; reader clamps).
  as_of: "2025-12-31"

