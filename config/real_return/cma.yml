# Capital Market Assumptions (CMA): forward-looking EXPECTED REAL returns per asset class,
# built from transparent, EDITABLE building-block components, plus annualized volatility (sigma).
#
# These are ASSUMPTIONS, not historical fact — every CMA provider (Vanguard, J.P. Morgan,
# BlackRock) publishes their own. We anchor the OBSERVABLE inputs (dividend yields, bond/deposit
# rates, cap rates, valuations) to real current data and document the GROWTH/REVERSION terms as
# judgments with rationale. sigma is taken from the bundled historical annual series where available.
# Edit any number; the engine sums the components per `kind`.
#
# Methodology per kind:
#   equity:      div_yield - net_dilution + real_earnings_growth + valuation_reversion   (Grinold-Kroner)
#   real_estate: net_rental_yield + real_rent_growth + valuation_reversion
#   bond:        real_yield        cash: real_rate        gold/other/crypto: real_return
metadata:
  approach: "Chain-structured building blocks (Grinold-Kroner equities; cap-rate+growth real estate; real yield bonds; golden-constant gold). Forward assumptions anchored to observable inputs; editable."
  as_of: "2026-05-31"
  sources: "Equity div yields & valuations: index data + Shiller CAPE / Damodaran ERP. Rates: current CN/US deposit & 10y yields. Cap rates: market data. sigma: historical annual vol of the bundled benchmark series. Gold: Erb-Harvey golden constant."

equity_cn:
  kind: equity
  dividend_yield: 0.028
  net_dilution: 0.010
  real_earnings_growth: 0.035
  valuation_reversion: 0.000
  sigma: 0.24
  sources:
    dividend_yield: "CSI 300 trailing dividend yield (~2.5–3%)"
    net_dilution: "net share issuance drag (~1%/yr, A-share supply)"
    real_earnings_growth: "assumption: China real earnings ~ real GDP (~4–5%) less leakage"
    valuation_reversion: "CSI 300 valuations near/below long-run average → ~no drag"

equity_us:
  kind: equity
  dividend_yield: 0.013
  net_dilution: -0.005
  real_earnings_growth: 0.025
  valuation_reversion: -0.015
  sigma: 0.16
  sources:
    dividend_yield: "S&P 500 trailing dividend yield (~1.3%)"
    net_dilution: "net buybacks add ~0.5%/yr (negative dilution)"
    real_earnings_growth: "assumption: US real earnings ~2–2.5%"
    valuation_reversion: "elevated CAPE (~33 vs ~17–20) → negative drag over horizon"

real_estate_cn:
  kind: real_estate
  net_rental_yield: 0.016
  real_rent_growth: 0.000
  valuation_reversion: -0.010
  sigma: 0.09
  sources:
    net_rental_yield: "China net rental yield / cap rate (~1.5–2%)"
    real_rent_growth: "assumption: weak (demographics, oversupply)"
    valuation_reversion: "elevated price/rent; BIS CN index correcting since 2021"

real_estate_us:
  kind: real_estate
  net_rental_yield: 0.035
  real_rent_growth: 0.005
  valuation_reversion: -0.005
  sigma: 0.07
  sources:
    net_rental_yield: "US net cap rate (~3.5–4%)"
    real_rent_growth: "assumption: modest real rent growth"
    valuation_reversion: "mildly elevated → small drag"

gold:
  kind: gold
  real_return: 0.000
  sigma: 0.16
  sources:
    real_return: "Erb & Harvey golden constant (NBER): gold long-run real ≈ 0"

govbond:
  kind: bond
  real_yield: 0.010
  sigma: 0.06
  sources:
    real_yield: "CN ~10y yield (~2.5%) − expected inflation (~1.5%) ≈ 1% real"

deposit:
  kind: cash
  real_rate: -0.005
  sigma: 0.01
  sources:
    real_rate: "CN 1y deposit (~1.5%) − expected inflation (~2%) ≈ −0.5% real"

crypto:
  kind: other
  real_return: 0.020
  sigma: 0.70
  sources:
    real_return: "assumption — speculative; very wide uncertainty"

other:
  kind: other
  real_return: 0.005
  sigma: 0.05
  sources:
    real_return: "assumption for mixed/managed products"
